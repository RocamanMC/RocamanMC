<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 95" width="500px" height="95px">
  <defs>
    <style>
      @font-face {
        font-family: 'Monocraft';
        src: url('data:font/woff2;base64,') format('woff2');
        font-weight: normal;
        font-style: normal;
      }
      .sign-title {
        font-family: 'Monocraft', monospace;
        font-size: 16px;
        fill: #FFFFFF;
        letter-spacing: 1.5px;
      }
      .sign-sub {
        font-family: 'Monocraft', monospace;
        font-size: 10px;
        fill: #00FF88;
        letter-spacing: 0.8px;
      }
    </style>
  </defs>

  <!-- Left Iron Chain -->
  <g transform="translate(85, 0)">
    <rect x="3" y="0" width="6" height="8" fill="#4B4B4B" />
    <rect x="4" y="2" width="4" height="4" fill="#8E8E8E" />
    <rect x="1" y="6" width="10" height="9" fill="#303030" rx="1" />
    <rect x="3" y="8" width="6" height="5" fill="#6A6A6A" />
    <rect x="3" y="13" width="6" height="8" fill="#4B4B4B" />
    <rect x="4" y="15" width="4" height="4" fill="#8E8E8E" />
    <rect x="1" y="19" width="10" height="9" fill="#303030" rx="1" />
    <rect x="3" y="21" width="6" height="5" fill="#6A6A6A" />
    <rect x="0" y="26" width="12" height="6" fill="#1C1106" />
    <rect x="2" y="27" width="8" height="4" fill="#6A6A6A" />
  </g>

  <!-- Right Iron Chain -->
  <g transform="translate(403, 0)">
    <rect x="3" y="0" width="6" height="8" fill="#4B4B4B" />
    <rect x="4" y="2" width="4" height="4" fill="#8E8E8E" />
    <rect x="1" y="6" width="10" height="9" fill="#303030" rx="1" />
    <rect x="3" y="8" width="6" height="5" fill="#6A6A6A" />
    <rect x="3" y="13" width="6" height="8" fill="#4B4B4B" />
    <rect x="4" y="15" width="4" height="4" fill="#8E8E8E" />
    <rect x="1" y="19" width="10" height="9" fill="#303030" rx="1" />
    <rect x="3" y="21" width="6" height="5" fill="#6A6A6A" />
    <rect x="0" y="26" width="12" height="6" fill="#1C1106" />
    <rect x="2" y="27" width="8" height="4" fill="#6A6A6A" />
  </g>

  <!-- Main Hanging Sign Board -->
  <g transform="translate(30, 28)">
    <rect x="0" y="0" width="440" height="62" fill="#1C1106" rx="4" />
    <rect x="3" y="3" width="434" height="56" fill="#5A3813" rx="2" />
    <rect x="3" y="3" width="434" height="4" fill="#D9AC6F" />
    <rect x="3" y="3" width="4" height="56" fill="#D9AC6F" />
    <rect x="3" y="55" width="434" height="4" fill="#3D2409" />
    <rect x="433" y="3" width="4" height="56" fill="#3D2409" />
    <rect x="7" y="7" width="426" height="48" fill="#8F6229" />
    <rect x="7" y="15" width="426" height="2" fill="#7D5323" opacity="0.6" />
    <rect x="7" y="27" width="426" height="3" fill="#9C6E33" opacity="0.7" />
    <rect x="7" y="40" width="426" height="2" fill="#6E491F" opacity="0.5" />
    <rect x="50" y="12" width="12" height="4" fill="#5A3813" opacity="0.4" />
    <rect x="180" y="32" width="16" height="3" fill="#5A3813" opacity="0.4" />
    <rect x="350" y="18" width="14" height="4" fill="#5A3813" opacity="0.4" />
    <rect x="9" y="9" width="4" height="4" fill="#331F0A" />
    <rect x="427" y="9" width="4" height="4" fill="#331F0A" />
    <rect x="9" y="49" width="4" height="4" fill="#331F0A" />
    <rect x="427" y="49" width="4" height="4" fill="#331F0A" />

    <!-- Crisp Single-Pass Text (No duplicate shadow layer) -->
    <g transform="translate(220, 30)" text-anchor="middle">
      <text class="sign-title" x="0" y="0">TABLON DE LA COMUNIDAD</text>
      <text class="sign-sub" x="0" y="18">CONECTA CON ROCAMAN EN TODAS LAS PLATAFORMAS</text>
    </g>

    <!-- Animated Neon Outline -->
    <rect x="3" y="3" width="434" height="56" fill="none" stroke="#00FF88" stroke-width="1.5" opacity="0.25" rx="2">
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>