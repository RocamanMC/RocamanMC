<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 145" width="60px" height="145px">
  <defs>
    <style>
      @keyframes creeperIdle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes creeperHeadTilt {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-3deg); }
        75% { transform: rotate(3deg); }
      }
      @keyframes footWalkLeft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2px); }
      }
      @keyframes footWalkRight {
        0%, 100% { transform: translateY(-2px); }
        50% { transform: translateY(0px); }
      }
      .creeper-body {
        animation: creeperIdle 3s ease-in-out infinite;
        transform-origin: center bottom;
      }
      .creeper-head {
        animation: creeperHeadTilt 6s ease-in-out infinite;
        transform-origin: 30px 48px;
      }
    </style>
    <!-- Subtle shadow filter -->
    <filter id="creeper-drop">
      <feDropShadow dx="0" dy="4" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ambient rising smoke/fuse particle -->
  <rect x="28" y="4" width="3" height="3" fill="#FFFFFF" opacity="0">
    <animate attributeName="y" values="6;-6" dur="2.4s" begin="0.5s" repeatCount="indefinite" />
    <animate attributeName="x" values="28;31" dur="2.4s" begin="0.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.8;0" dur="2.4s" begin="0.5s" repeatCount="indefinite" />
  </rect>
  <rect x="33" y="2" width="2" height="2" fill="#888888" opacity="0">
    <animate attributeName="y" values="4;-8" dur="2.8s" begin="1.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.7;0" dur="2.8s" begin="1.2s" repeatCount="indefinite" />
  </rect>

