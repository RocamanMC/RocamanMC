<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" width="160px" height="90px">
  <defs>
    <style>
      @keyframes floatAnim {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes gillWiggle {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(3deg); }
      }
      .axolotl-body {
        animation: floatAnim 3.5s ease-in-out infinite;
        transform-origin: center;
      }
      .gills-left {
        animation: gillWiggle 2s ease-in-out infinite alternate;
        transform-origin: 32px 24px;
      }
      .gills-right {
        animation: gillWiggle 2s ease-in-out infinite alternate-reverse;
        transform-origin: 106px 24px;
      }
    </style>
  </defs>

  <!-- Ambient Rising Pixels -->
  <rect x="18" y="60" width="3" height="3" fill="#00FF88" opacity="0">
    <animate attributeName="y" values="65;15" dur="3.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.9;0" dur="3.2s" repeatCount="indefinite" />
  </rect>
  <rect x="138" y="70" width="3" height="3" fill="#00E5FF" opacity="0">
    <animate attributeName="y" values="75;20" dur="2.7s" begin="0.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.9;0" dur="2.7s" begin="0.8s" repeatCount="indefinite" />
  </rect>
  <rect x="78" y="75" width="2" height="2" fill="#00FF88" opacity="0">
    <animate attributeName="y" values="80;40" dur="2.2s" begin="1.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.8;0" dur="2.2s" begin="1.4s" repeatCount="indefinite" />
  </rect>

  <!-- Main Axolotl Body Group (Floats) -->
  <g class="axolotl-body" transform="translate(10, 8)">
    
    <!-- Tail behind -->
    <rect x="54" y="48" width="30" height="14" fill="#00B4D8" rx="2" />
    <rect x="64" y="52" width="10" height="8" fill="#00FF88">
      <animate attributeName="x" values="62;66;62" dur="2s" repeatCount="indefinite" />
    </rect>

    <!-- Gills Left (Wiggles) -->
    <g class="gills-left">
      <rect x="25" y="10" width="8" height="6" fill="#00FF88" />
      <rect x="20" y="16" width="10" height="6" fill="#00FF88" />
      <rect x="25" y="22" width="6" height="6" fill="#00FF88" />
      <rect x="22" y="18" width="4" height="2" fill="#69F0AE" />
    </g>

    <!-- Gills Right (Wiggles) -->
    <g class="gills-right">
      <rect x="105" y="10" width="8" height="6" fill="#00FF88" />
      <rect x="108" y="16" width="10" height="6" fill="#00FF88" />
      <rect x="107" y="22" width="6" height="6" fill="#00FF88" />
      <rect x="112" y="18" width="4" height="2" fill="#69F0AE" />
    </g>

    <!-- Head -->
    <rect x="32" y="8" width="74" height="40" fill="#00E5FF" rx="4" />
    
    <!-- Cheeks (Blushing) -->
    <rect x="36" y="32" width="8" height="4" fill="#00B0FF" opacity="0.6" />
    <rect x="94" y="32" width="8" height="4" fill="#00B0FF" opacity="0.6" />

    <!-- Left Eye (Blinking Animation) -->
    <rect x="44" y="20" width="8" height="12" fill="#000000" rx="1">
      <animate attributeName="height" values="12;12;12;2;12" keyTimes="0;0.88;0.92;0.96;1" dur="4s" repeatCount="indefinite" />
      <animate attributeName="y" values="20;20;20;25;20" keyTimes="0;0.88;0.92;0.96;1" dur="4s" repeatCount="indefinite" />
    </rect>
    <rect x="46" y="22" width="3" height="4" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;1;1;0;1" keyTimes="0;0.88;0.92;0.96;1" dur="4s" repeatCount="indefinite" />
    </rect>

    <!-- Right Eye (Blinking Animation) -->
    <rect x="86" y="20" width="8" height="12" fill="#000000" rx="1">
      <animate attributeName="height" values="12;12;12;2;12" keyTimes="0;0.88;0.92;0.96;1" dur="4s" repeatCount="indefinite" />
      <animate attributeName="y" values="20;20;20;25;20" keyTimes="0;0.88;0.92;0.96;1" dur="4s" repeatCount="indefinite" />
    </rect>
    <rect x="88" y="22" width="3" height="4" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;1;1;0;1" keyTimes="0;0.88;0.92;0.96;1" dur="4s" repeatCount="indefinite" />
    </rect>

    <!-- Smile -->
    <rect x="64" y="36" width="10" height="3" fill="#004D40" />
    <rect x="62" y="33" width="3" height="3" fill="#004D40" />
    <rect x="73" y="33" width="3" height="3" fill="#004D40" />
  </g>
</svg>