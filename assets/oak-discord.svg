<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 58" width="210px" height="58px">
  <defs>
    <style>
      @font-face {
        font-family: 'Monocraft';
        src: url('data:font/woff2;base64,') format('woff2');
        font-weight: normal;
        font-style: normal;
      }
      .mc-title {
        font-family: 'Monocraft', monospace;
        font-size: 13px;
        fill: #FFFFFF;
        letter-spacing: 0.5px;
      }
      .mc-sub {
        font-family: 'Monocraft', monospace;
        font-size: 10px;
        fill: #8C9EFF;
        letter-spacing: 0.2px;
      }
    </style>
  </defs>

  <!-- Outer Dark Shadow Border -->
  <rect x="0" y="0" width="210" height="58" fill="#1C1106" rx="3" />
  
  <!-- Outer Oak Border (Bevel) -->
  <rect x="2" y="2" width="206" height="54" fill="#5A3813" rx="2" />
  
  <!-- Top & Left Highlight -->
  <rect x="2" y="2" width="206" height="3" fill="#D9AC6F" />
  <rect x="2" y="2" width="3" height="54" fill="#D9AC6F" />

  <!-- Bottom & Right Shadow -->
  <rect x="2" y="53" width="206" height="3" fill="#3D2409" />
  <rect x="205" y="2" width="3" height="54" fill="#3D2409" />

  <!-- Main Oak Wood Plank Body -->
  <rect x="5" y="5" width="200" height="48" fill="#8F6229" />

  <!-- Oak Wood Grain Lines (Pixel Art Texture) -->
  <rect x="5" y="10" width="200" height="2" fill="#7D5323" opacity="0.6" />
  <rect x="5" y="21" width="200" height="2" fill="#9C6E33" opacity="0.8" />
  <rect x="5" y="32" width="200" height="2" fill="#6E491F" opacity="0.5" />
  <rect x="5" y="42" width="200" height="2" fill="#9C6E33" opacity="0.7" />
  
  <!-- Subtle Wood Knots / Pixels -->
  <rect x="35" y="8" width="8" height="3" fill="#5A3813" opacity="0.4" />
  <rect x="90" y="24" width="12" height="2" fill="#5A3813" opacity="0.4" />
  <rect x="160" y="36" width="10" height="3" fill="#5A3813" opacity="0.4" />

  <!-- Corner Iron Rivets/Bolts -->
  <rect x="6" y="6" width="3" height="3" fill="#331F0A" />
  <rect x="201" y="6" width="3" height="3" fill="#331F0A" />
  <rect x="6" y="49" width="3" height="3" fill="#331F0A" />
  <rect x="201" y="49" width="3" height="3" fill="#331F0A" />

  <!-- Brand Icon Frame (Inset Minecraft Slot) -->
  <g transform="translate(14, 10)">
    <rect x="0" y="0" width="38" height="38" fill="#1C1106" rx="3" />
    <rect x="1" y="1" width="36" height="36" fill="#3D2409" rx="2" />
    <rect x="2" y="2" width="34" height="34" fill="#5865F2" rx="1" />
    
    <!-- Official Icon SVG Scaled into 24x24 box inside the 34x34 colored slot -->
    <g transform="translate(7, 7) scale(0.8333)">
      <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Crisp Single-Pass Monocraft Text -->
  <g transform="translate(60, 25)">
    <text class="mc-title" x="0" y="0">Discord</text>
    <text class="mc-sub" x="0" y="17">Rocacraft</text>
  </g>

  <!-- Subtle Enchanted Glow on Border -->
  <rect x="2" y="2" width="206" height="54" fill="none" stroke="#8C9EFF" stroke-width="1.5" opacity="0.25" rx="2">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3s" repeatCount="indefinite" />
  </rect>
</svg>