<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 64" width="32px" height="64px">
  <defs>
    <radialGradient id="torch-glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FF2200" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FF0000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF0000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Redstone Light Aura (Flickering Pulse) -->
  <circle cx="16" cy="20" r="15" fill="url(#torch-glow)">
    <animate attributeName="r" values="14; 18; 15; 17; 14" dur="2.1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6; 1; 0.7; 0.9; 0.6" dur="2.1s" repeatCount="indefinite" />
  </circle>

  <!-- Floating Redstone Dust Particles -->
  <rect x="15" y="16" width="2" height="2" fill="#FF4422" opacity="0">
    <animate attributeName="y" values="16; 2" dur="2s" begin="0.2s" repeatCount="indefinite" />
    <animate attributeName="x" values="15; 13; 17" dur="2s" begin="0.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 1; 0.8; 0" dur="2s" begin="0.2s" repeatCount="indefinite" />
  </rect>
  <rect x="17" y="18" width="2" height="2" fill="#FFAA00" opacity="0">
    <animate attributeName="y" values="18; 4" dur="2.4s" begin="0.9s" repeatCount="indefinite" />
    <animate attributeName="x" values="17; 19; 15" dur="2.4s" begin="0.9s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 0.9; 0.7; 0" dur="2.4s" begin="0.9s" repeatCount="indefinite" />
  </rect>

  <!-- Wooden Stick (Minecraft Pixels: x=14 to 18, y=24 to 58) -->
  <!-- Dark Wood Shadow -->
  <rect x="14" y="24" width="4" height="34" fill="#3D2409" />
  <!-- Main Wood Plank Tone -->
  <rect x="14" y="24" width="2" height="34" fill="#5C3A14" />
  <!-- Wood Highlight -->
  <rect x="15" y="24" width="1" height="34" fill="#8B5A2B" />

  <!-- Redstone Tip Core (Pixel Art Block) -->
  <!-- Dark Red Base -->
  <rect x="12" y="14" width="8" height="10" fill="#880000" rx="1" />
  <!-- Bright Red Core -->
  <rect x="13" y="13" width="6" height="8" fill="#FF1E00" />
  <!-- Hot Redstone Center -->
  <rect x="14" y="14" width="4" height="5" fill="#FF4422" />
  <!-- Sparking Yellow/Orange Tip -->
  <rect x="15" y="13" width="2" height="2" fill="#FFAA00">
    <animate attributeName="fill" values="#FFAA00;#FFDD44;#FF5500;#FFAA00" dur="1.2s" repeatCount="indefinite" />
  </rect>
</svg>