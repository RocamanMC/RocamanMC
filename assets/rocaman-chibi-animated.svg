<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 228 235" width="88px" height="90px">
  <defs>
    <style>
      @keyframes chibiBob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .chibi-sprite {
        animation: chibiBob 3.5s ease-in-out infinite;
        transform-origin: bottom center;
      }
    </style>
  </defs>
  <g class="chibi-sprite">
    <image href="data:image/png;base64," width="228" height="235" />
  </g>
</svg>