<svg xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    viewBox="0 0 700 50"
    width="700px" height="50px">
  <defs>
    <style>
      @font-face {
        font-family: 'Monocraft';
        src: url('data:font/woff2;base64,') format('woff2');
        font-weight: normal;
        font-style: normal;
      }
      .typing-text {
        font-family: 'Monocraft', monospace;
        fill: #00FF88;
        font-size: 20px;
        letter-spacing: 1px;
      }
    </style>
    <path id="path0">
      <animate id="d0" attributeName="d" begin="0s;d3.end"
        dur="3400ms" fill="remove"
        values="m0,28 h0 ; m0,28 h700 ; m0,28 h700 ; m0,28 h0" keyTimes="0;0.5;0.85;1" />
    </path>
    <path id="path1">
      <animate id="d1" attributeName="d" begin="d0.end"
        dur="3400ms" fill="remove"
        values="m0,28 h0 ; m0,28 h700 ; m0,28 h700 ; m0,28 h0" keyTimes="0;0.5;0.85;1" />
    </path>
    <path id="path2">
      <animate id="d2" attributeName="d" begin="d1.end"
        dur="3400ms" fill="remove"
        values="m0,28 h0 ; m0,28 h700 ; m0,28 h700 ; m0,28 h0" keyTimes="0;0.5;0.85;1" />
    </path>
    <path id="path3">
      <animate id="d3" attributeName="d" begin="d2.end"
        dur="3400ms" fill="remove"
        values="m0,28 h0 ; m0,28 h700 ; m0,28 h700 ; m0,28 h0" keyTimes="0;0.5;0.85;1" />
    </path>
  </defs>

  <text class="typing-text" dominant-baseline="middle" x="50%" text-anchor="middle">
    <textPath xlink:href="#path0">¡Bienvenido a mi perfil!</textPath>
  </text>
  <text class="typing-text" dominant-baseline="middle" x="50%" text-anchor="middle">
    <textPath xlink:href="#path1">Escucha música gratis con Rocafy</textPath>
  </text>
  <text class="typing-text" dominant-baseline="middle" x="50%" text-anchor="middle">
    <textPath xlink:href="#path2">Construyendo bloque a bloque</textPath>
  </text>
  <text class="typing-text" dominant-baseline="middle" x="50%" text-anchor="middle">
    <textPath xlink:href="#path3">Explora mis aplicaciones en Vercel</textPath>
  </text>
</svg>