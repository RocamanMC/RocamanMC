<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 86" width="540px" height="86px">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF88" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="540" height="86" rx="10" fill="#0d1117" stroke="#00FF88" stroke-width="1.5" />
  
  <!-- Vinyl icon -->
  <g transform="translate(15, 13)">
    <circle cx="30" cy="30" r="28" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="30" cy="30" r="20" fill="#0d1117" />
    <circle cx="30" cy="30" r="10" fill="#00FF88" />
    <circle cx="30" cy="30" r="3" fill="#ffffff" />
  </g>

  <!-- Title & Artist -->
  <text x="88" y="32" fill="#ffffff" font-family="monospace" font-size="15" font-weight="bold">Rocaman — Bloque a Bloque (Theme)</text>
  <text x="88" y="49" fill="#8b949e" font-family="monospace" font-size="12">Rocafy • Reproduciendo en streaming (rocafy.vercel.app)</text>

  <!-- Progress Bar -->
  <rect x="88" y="60" width="340" height="5" rx="2.5" fill="#21262d" />
  <rect x="88" y="60" width="220" height="5" rx="2.5" fill="url(#barGrad)" />
  <circle cx="308" cy="62.5" r="4.5" fill="#00E5FF" />

  <!-- Time -->
